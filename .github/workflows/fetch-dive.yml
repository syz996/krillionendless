name: fetch dive

on:
  schedule:
    # 纽约 20:00–23:00 = UTC 00:00–03:00（夏令时）。多设几点，抵消 GitHub 定时延迟
    - cron: '0 0,1,2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '无视纽约窗口强制打包（会把当天薄草稿一并定型，慎用）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check fetch-dive.mjs
      - run: node --check complete-dive.mjs
      - run: node fetch-dive.mjs
      # 晚间重抓覆盖当日「薄」答案（脚本自带 20:00–23:00 纽约窗口守卫）
      - run: node fetch-dive.mjs --refetch
      # 补写 hint/analysis 并打包为正式数据（脚本自带同窗口守卫）
      - name: 补全 hint/analysis 并打包
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node complete-dive.mjs --force
          else
            node complete-dive.mjs
          fi
      - run: node fetch-dive.mjs --verify
      - run: node generate-deepcut.mjs
      # if: always() 是护栏：某一期打包失败时，前面已成功的期仍要推上去
      - name: Commit and push changes
        if: always()
        run: |
          git config user.name  "dive-bot"
          git config user.email "bot@krillionendless.org"
          git add content/ public/data/
          git diff --cached --quiet || git commit -m "dive: $(TZ=America/New_York date +%F)"
          git push
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Dive fetch failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'The scheduled dive fetch failed and needs a manual check.',
              '',
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'This issue was created automatically. Close it after the pipeline is fixed.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
