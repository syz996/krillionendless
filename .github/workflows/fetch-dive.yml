name: fetch dive

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 17:00 = 纽约 13:00（夏令时），翻期后首抓（草稿）
    - cron: '0 1 * * *'    # UTC 1:00 = 纽约 21:00（夏令时），晚间重抓补全当日答案池
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check fetch-dive.mjs
      - run: node fetch-dive.mjs
      # 晚间 cron 触发时重抓覆盖当日「薄」答案（脚本自带 20:00–23:00 纽约窗口守卫，白天运行自动跳过）
      - run: node fetch-dive.mjs --refetch
      - run: node fetch-dive.mjs --verify
      - run: node generate-deepcut.mjs
      - run: |
          git config user.name  "dive-bot"
          git config user.email "bot@krillionendless.org"
          git add content/ public/data/
          git diff --cached --quiet || git commit -m "dive: $(date -u +%F)"
          git push
      # 任一步骤失败时自动开 issue：数据断档必须人工介入，不能静默失败
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Dive fetch failed on ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'The scheduled dive fetch failed and needs a manual check.',
              '',
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'This issue was created automatically. Close it after the pipeline is fixed.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });